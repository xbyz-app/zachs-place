<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <!--
      Static form stubs so Netlify Forms detects guest-vibe and guest-feedback.
      Astro injects data-astro-cid-* attributes into the rendered pages, which
      can prevent Netlify's deploy-time HTML parser from matching submissions
      back to the form definitions. This file is pure HTML and matches the
      field names declared in src/components/Feedback.astro and src/pages/feedback.astro.
      Keep field names in sync with those files.
    -->
    <form name="guest-vibe" netlify netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="guest-vibe" />
      <input name="face" />
      <input name="bot-field" />
    </form>
    <form name="guest-feedback" netlify netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="guest-feedback" />
      <input name="getting_in" />
      <input name="wifi" />
      <input name="bed" />
      <input name="shower" />
      <input name="lights" />
      <input name="sonos" />
      <input name="coffee" />
      <input name="building" />
      <textarea name="notes"></textarea>
      <input name="from" />
      <input name="bot-field" />
    </form>
  </body>
</html>
